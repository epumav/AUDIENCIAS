<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Calendario semanal - 2 cuentas Gmail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Google Calendar</p>
      <h1>Calendario semanal</h1>
      <p class="subtitle">Vista automática de dos cuentas Gmail autorizadas</p>
    </div>
    <div class="accounts" aria-label="Cuentas configuradas">
      <div class="account-chip"><span class="dot account-1"></span><span id="account1Label">Cuenta 1</span></div>
      <div class="account-chip"><span class="dot account-2"></span><span id="account2Label">Cuenta 2</span></div>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-label="Navegación semanal">
      <div class="nav-group">
        <button class="icon-btn" id="prevWeek" type="button" aria-label="Semana anterior">‹</button>
        <button class="today-btn" id="todayBtn" type="button">Hoy</button>
        <button class="icon-btn" id="nextWeek" type="button" aria-label="Semana siguiente">›</button>
      </div>
      <div class="week-heading">
        <h2 id="weekTitle">Semana</h2>
        <span id="statusText">Cargando calendarios…</span>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button">Actualizar</button>
    </section>

    <section id="notice" class="notice hidden" role="status"></section>

    <section class="calendar-card">
      <div id="weekGrid" class="week-grid" aria-live="polite"></div>
    </section>
  </main>

  <template id="dayTemplate">
    <article class="day-column">
      <header class="day-header">
        <span class="day-name"></span>
        <span class="day-number"></span>
      </header>
      <div class="events"></div>
    </article>
  </template>

  <template id="eventTemplate">
    <article class="event-card">
      <div class="event-topline">
        <span class="event-time"></span>
        <span class="event-account"></span>
      </div>
      <div class="event-title"></div>
      <div class="event-date"></div>
      <a class="meet-link hidden" target="_blank" rel="noopener noreferrer">Abrir Google Meet</a>
      <span class="no-meet hidden">Sin enlace de Meet</span>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
